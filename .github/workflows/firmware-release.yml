name: Firmware Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "esp32/**"
      - ".github/workflows/firmware-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ESP32 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: esp32

      - name: Publish latest firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="firmware-latest"
          asset="esp32/build/swirski_os_esp32.bin"
          short_sha="${GITHUB_SHA:0:7}"
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          notes="$(printf 'Automated rolling firmware build.\n\nCommit: `%s`\nBuilt: %s' "$GITHUB_SHA" "$built_at")"

          test -s "$asset"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi

          # Remove a leftover tag if a previous publication was interrupted.
          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            >/dev/null 2>&1; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
          fi

          gh release create "$tag" "$asset" \
            --target "$GITHUB_SHA" \
            --title "Latest firmware (${short_sha})" \
            --notes "$notes"
